; Cau hinh PHP thu gon di kem website Mi Cay Sasin.
; extension_dir duoc START.bat truyen vao theo vi tri thu muc nay.
extension=pdo_sqlite
extension=pdo_mysql
extension=mbstring

memory_limit = 128M
display_errors = Off
log_errors = On
default_charset = "UTF-8"
date.timezone = Asia/Ho_Chi_Minh
session.use_strict_mode = 1
